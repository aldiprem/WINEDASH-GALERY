<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Plush Pepe #1 - Telegram Gift</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: transparent !important;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        body {
            background: transparent !important;
        }

        .gift-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: transparent !important;
            padding: 20px;
        }

        .animation-wrapper {
            width: 100%;
            max-width: 400px;
            aspect-ratio: 1;
            position: relative;
            background: transparent !important;
        }

        #lottie-container {
            width: 100%;
            height: 100%;
            background: transparent !important;
        }

        /* Pastikan semua elemen SVG dari Lottie transparan */
        #lottie-container svg {
            background: transparent !important;
        }

        .gift-title {
            margin-top: 24px;
            padding: 10px 24px;
            font-size: 16px;
            font-weight: 500;
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--tg-theme-text-color, #000000);
            transition: all 0.2s ease;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--tg-theme-hint-color, #999999);
            font-size: 14px;
            z-index: 1;
            background: transparent;
        }

        /* Dark mode support via Telegram theme */
        @media (prefers-color-scheme: dark) {
            .gift-title {
                background: rgba(0, 0, 0, 0.2);
                border-color: rgba(255, 255, 255, 0.1);
            }
        }
    </style>
</head>
<body>
    <div class="gift-container">
        <div class="animation-wrapper">
            <div id="lottie-container"></div>
            <div class="loading" id="loading">Memuat animasi...</div>
        </div>
        <div class="gift-title" id="giftTitle">Plush Pepe #1</div>
    </div>

    <!-- Telegram Web App SDK (wajib untuk Mini App) -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Lottie Web Player -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>

    <script>
        (function() {
            // Inisialisasi Telegram Web App
            const tg = window.Telegram?.WebApp;
            
            if (tg) {
                // Konfigurasi dasar Telegram Mini App
                tg.ready(); // Memberitahu Telegram bahwa app siap
                tg.expand(); // Memperluas ke full screen
                tg.disableVerticalSwipes(); // Mencegah swipe gesture
                
                // Set background transparan (jika didukung versi Telegram)
                if (tg.setBackgroundColor) {
                    tg.setBackgroundColor('#00000000');
                }
                
                // Sembunyikan tombol back (jika didukung)
                try {
                    tg.BackButton?.hide();
                } catch (e) {
                    console.log('BackButton not supported in this version');
                }
                
                console.log('✅ Telegram Web App initialized', {
                    version: tg.version,
                    platform: tg.platform,
                    theme: tg.colorScheme
                });
            }

            // Konfigurasi Lottie
            const container = document.getElementById('lottie-container');
            const loading = document.getElementById('loading');
            const giftTitle = document.getElementById('giftTitle');

            // URL Lottie JSON
            const LOTTIE_URL = 'https://nft.fragment.com/gift/PlushPepe-1.lottie.json';

            // Sesuaikan warna teks dengan tema Telegram
            if (tg && giftTitle) {
                giftTitle.style.color = tg.themeParams?.text_color || 
                                        (tg.colorScheme === 'dark' ? '#ffffff' : '#000000');
            }

            // Load animasi Lottie dengan konfigurasi transparan
            const anim = lottie.loadAnimation({
                container: container,
                renderer: 'svg', // SVG memberikan transparansi terbaik
                loop: true,
                autoplay: true,
                path: LOTTIE_URL,
                rendererSettings: {
                    preserveAspectRatio: 'xMidYMid meet',
                    clearCanvas: true,
                    progressiveLoad: true,
                    hideOnTransparent: true, // Penting untuk transparansi
                    className: 'lottie-animation'
                }
            });

            // Event ketika animasi mulai dimuat
            anim.addEventListener('data_ready', () => {
                console.log('📦 Data animasi siap');
            });

            // Event ketika animasi berhasil dimuat dan ditampilkan
            anim.addEventListener('DOMLoaded', () => {
                console.log('✅ Animasi berhasil dimuat');
                
                // Hapus loading indicator
                if (loading) {
                    loading.style.opacity = '0';
                    setTimeout(() => {
                        loading.style.display = 'none';
                    }, 300);
                }

                // Pastikan semua elemen SVG memiliki background transparan
                const svgElements = container.getElementsByTagName('svg');
                for (let svg of svgElements) {
                    svg.style.backgroundColor = 'transparent';
                    svg.style.background = 'transparent';
                }
            });

            // Error handling
            anim.addEventListener('data_failed', (error) => {
                console.error('❌ Gagal memuat data animasi:', error);
                if (loading) {
                    loading.textContent = 'Gagal memuat animasi';
                    loading.style.color = '#ff4444';
                }
            });

            // Force background transparan setiap frame (untuk jaga-jaga)
            function ensureTransparentBackground() {
                const svgs = container.getElementsByTagName('svg');
                for (let svg of svgs) {
                    if (svg.style.backgroundColor !== 'transparent') {
                        svg.style.backgroundColor = 'transparent';
                        svg.style.background = 'transparent';
                    }
                    
                    // Cek dan bersihkan elemen rect putih yang mungkin muncul
                    const rects = svg.getElementsByTagName('rect');
                    for (let rect of rects) {
                        if (rect.getAttribute('fill') === '#ffffff' || 
                            rect.getAttribute('fill') === 'white' ||
                            rect.getAttribute('style')?.includes('background')) {
                            rect.setAttribute('fill', 'transparent');
                            rect.setAttribute('opacity', '0');
                        }
                    }
                }
                requestAnimationFrame(ensureTransparentBackground);
            }

            // Jalankan pemeriksaan transparansi setelah animasi dimuat
            anim.addEventListener('DOMLoaded', () => {
                setTimeout(ensureTransparentBackground, 100);
            });

            // Bersihkan resource saat halaman ditutup
            window.addEventListener('beforeunload', () => {
                if (anim) {
                    anim.destroy();
                }
            });

            // Debug: tampilkan informasi di console
            console.log('🚀 Memulai animasi dari:', LOTTIE_URL);

        })();
    </script>
</body>
</html>
