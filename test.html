<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TGS Sticker Viewer - Plush Pepe #1</title>
    <link rel="stylesheet" href="/WINEDASH-GALERY/css/test.css">
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Lottie Player untuk TGS -->
    <script src="https://unpkg.com/@lottiefiles/lottie-player@1.7.1/dist/lottie-player.js"></script>
</head>
<body>
    <div class="tgs-container">
        <div class="sticker-wrapper">
            <!-- Lottie Player untuk TGS -->
            <lottie-player
                id="tgs-player"
                src=""
                background="transparent"
                speed="1"
                style="width: 100%; height: 100%;"
                loop
                autoplay>
            </lottie-player>
            
            <!-- Loading Indicator -->
            <div class="loading-indicator" id="loadingIndicator">
                <div class="loading-spinner"></div>
                <div class="loading-text">Memuat sticker...</div>
            </div>
            
            <!-- Error Message -->
            <div class="error-message" id="errorMessage" style="display: none;">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <circle cx="12" cy="12" r="10" stroke-width="1.5"/>
                    <path d="M12 8V12M12 16H12.01" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
                <div>Gagal memuat sticker</div>
            </div>
        </div>
        
        <!-- Gift Info Panel -->
        <div class="gift-info-panel" id="giftInfoPanel">
            <div class="gift-title">
                <span class="gift-name">Plush Pepe</span>
                <span class="gift-number">#1</span>
            </div>
            
            <div class="gift-attributes" id="giftAttributes">
                <!-- Akan diisi oleh JavaScript -->
                <div class="attribute-skeleton"></div>
                <div class="attribute-skeleton"></div>
                <div class="attribute-skeleton"></div>
            </div>
            
            <div class="gift-availability" id="giftAvailability">
                <!-- Akan diisi oleh JavaScript -->
            </div>
        </div>
        
        <!-- Action Buttons -->
        <div class="action-buttons">
            <button class="action-btn primary" id="refreshBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M23 4v6h-6M1 20v-6h6" stroke-width="2" stroke-linecap="round"/>
                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <span>Refresh</span>
            </button>
            
            <a href="https://t.me/nft/PlushPepe-1" class="action-btn secondary" target="_blank">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z" stroke-width="1.5"/>
                    <path d="M8 10L12 14L16 10" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>Buka di Telegram</span>
            </a>
        </div>
    </div>

    <script src="/WINEDASH-GALERY/js/test.js"></script>
</body>
</html>
