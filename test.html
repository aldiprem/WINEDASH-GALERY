<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Plush Pepe #1 - TGS Gift</title>
    <style>
        /* === RESET DAN GAYA DASAR === */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: transparent !important; /* PENTING: Latar transparan */
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Kontainer utama dengan latar transparan */
        .container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: transparent !important;
            position: relative;
        }

        /* Wrapper untuk animasi TGS */
        .tgs-wrapper {
            width: 100%;
            max-width: 400px;
            aspect-ratio: 1 / 1;
            background-color: transparent !important;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Canvas untuk render TGS */
        #tgs-canvas {
            width: 100%;
            height: 100%;
            display: block;
            background-color: transparent !important;
            image-rendering: crisp-edges; /* Optimasi untuk kualitas */
        }

        /* Indikator loading minimalis */
        .tgs-loading {
            position: absolute;
            color: #999;
            font-size: 14px;
            background-color: transparent;
            text-shadow: 0 1px 2px rgba(0,0,0,0.1);
            pointer-events: none;
            z-index: 1;
        }

        /* Gaya info gift yang transparan */
        .gift-info {
            margin-top: 20px;
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 500;
            background-color: rgba(128, 128, 128, 0.1);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #000000;
            transition: all 0.2s ease;
        }

        /* Tema gelap Telegram */
        @media (prefers-color-scheme: dark) {
            .gift-info {
                color: #ffffff;
                background-color: rgba(0, 0, 0, 0.3);
                border-color: rgba(255, 255, 255, 0.05);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="tgs-wrapper">
            <!-- Canvas untuk render TGS -->
            <canvas id="tgs-canvas"></canvas>
            <!-- Loading indicator (akan hilang setelah render) -->
            <div class="tgs-loading" id="loading">Memuat sticker...</div>
        </div>
        
        <div class="gift-info" id="giftInfo">
            🎁 Plush Pepe #1
        </div>
    </div>

    <!-- Library RLOTTIE untuk TGS (lebih ringan dari Lottie Web) -->
    <script src="https://unpkg.com/@lottiefiles/rlottie@1.4.0/rlottie.js"></script>
    
    <script>
        (function() {
            // URL TGS dari Fragment.com (format .tgs)
            const TGS_URL = 'https://nft.fragment.com/gift/PlushPepe-1.tgs';
            
            // Dapatkan elemen yang diperlukan
            const canvas = document.getElementById('tgs-canvas');
            const loadingEl = document.getElementById('loading');
            const giftInfo = document.getElementById('giftInfo');
            
            // Pastikan canvas ada
            if (!canvas) {
                console.error('Canvas tidak ditemukan!');
                return;
            }

            // Konfigurasi dimensi canvas
            const ctx = canvas.getContext('2d', { alpha: true }); // alpha: true untuk transparansi
            canvas.width = 512;
            canvas.height = 512;

            // Fungsi untuk memuat dan merender TGS
            async function loadTGS() {
                try {
                    // Tampilkan loading
                    if (loadingEl) loadingEl.style.display = 'block';

                    // Fetch file TGS
                    const response = await fetch(TGS_URL);
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    
                    // Dapatkan array buffer dari TGS
                    const tgsData = await response.arrayBuffer();
                    
                    // Inisialisasi RLottie dengan data TGS
                    const animation = new rlottie.RLottie();
                    
                    // Load dari buffer
                    const success = await animation.loadFromBuffer(new Uint8Array(tgsData));
                    
                    if (!success) {
                        throw new Error('Gagal memuat data TGS');
                    }

                    // Dapatkan informasi animasi
                    const frameCount = animation.totalFrame();
                    const fps = animation.fps();
                    
                    console.log(`✅ TGS loaded: ${frameCount} frames, ${fps} fps`);

                    // Sembunyikan loading
                    if (loadingEl) {
                        loadingEl.style.opacity = '0';
                        setTimeout(() => {
                            if (loadingEl && loadingEl.parentNode) {
                                loadingEl.style.display = 'none';
                            }
                        }, 300);
                    }

                    // Variabel untuk animasi
                    let currentFrame = 0;
                    let lastTimestamp = 0;
                    const frameDuration = 1000 / fps; // Durasi per frame dalam ms

                    // Fungsi render frame
                    function renderFrame(timestamp) {
                        if (!lastTimestamp) {
                            lastTimestamp = timestamp;
                        }

                        // Hitung delta waktu
                        const deltaTime = timestamp - lastTimestamp;
                        
                        // Update frame berdasarkan waktu
                        if (deltaTime >= frameDuration) {
                            // Render frame saat ini ke canvas
                            const imageData = animation.render(currentFrame, canvas.width, canvas.height);
                            
                            // Konversi ImageData ke canvas
                            if (imageData && imageData.data) {
                                ctx.clearRect(0, 0, canvas.width, canvas.height); // Bersihkan canvas
                                ctx.putImageData(imageData, 0, 0); // Render frame baru
                            }
                            
                            // Update frame berikutnya
                            currentFrame = (currentFrame + 1) % frameCount;
                            lastTimestamp = timestamp;
                        }

                        // Lanjutkan animasi
                        requestAnimationFrame(renderFrame);
                    }

                    // Mulai animasi
                    requestAnimationFrame(renderFrame);

                } catch (error) {
                    console.error('❌ Error loading TGS:', error);
                    if (loadingEl) {
                        loadingEl.textContent = 'Gagal memuat sticker';
                        loadingEl.style.color = '#ff4444';
                    }
                    
                    // Fallback: Coba dengan format Lottie JSON
                    console.log('Mencoba fallback ke Lottie JSON...');
                    loadLottieFallback();
                }
            }

            // Fungsi fallback ke Lottie JSON jika TGS gagal
            function loadLottieFallback() {
                const script = document.createElement('script');
                script.src = 'https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js';
                script.onload = function() {
                    lottie.loadAnimation({
                        container: canvas,
                        renderer: 'canvas',
                        loop: true,
                        autoplay: true,
                        path: 'https://nft.fragment.com/gift/PlushPepe-1.lottie.json',
                        rendererSettings: {
                            clearCanvas: true,
                            context: ctx,
                            preserveAspectRatio: 'xMidYMid meet'
                        }
                    });
                    
                    if (loadingEl) {
                        loadingEl.style.display = 'none';
                    }
                };
                document.head.appendChild(script);
            }

            // Mulai load TGS
            loadTGS();

            // === INTEGRASI TELEGRAM WEB APP ===
            // Load Telegram Web App SDK
            const telegramScript = document.createElement('script');
            telegramScript.src = 'https://telegram.org/js/telegram-web-app.js';
            telegramScript.onload = function() {
                if (window.Telegram && Telegram.WebApp) {
                    // Inisialisasi Telegram Web App
                    const webapp = Telegram.WebApp;
                    
                    // Perluas ke full screen
                    webapp.expand();
                    
                    // Sembunyikan tombol back
                    webapp.BackButton.hide();
                    
                    // Set background transparan
                    webapp.setBackgroundColor ? webapp.setBackgroundColor('#00000000') : null;
                    
                    // Dapatkan tema warna
                    const theme = webapp.themeParams;
                    
                    // Sesuaikan warna teks info dengan tema Telegram
                    if (giftInfo) {
                        giftInfo.style.color = theme.text_color || (webapp.colorScheme === 'dark' ? '#ffffff' : '#000000');
                    }
                    
                    console.log('✅ Telegram Web App initialized');
                }
            };
            document.head.appendChild(telegramScript);

        })();
    </script>
</body>
</html>
