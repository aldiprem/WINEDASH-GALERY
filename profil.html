<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>WINEDASH • Profil Saya</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Lottie Web Player -->
    <script src="https://unpkg.com/@lottiefiles/lottie-player@1.7.1/dist/lottie-player.js"></script>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="noise"></div>
    <div class="gradient-bg"></div>

    <!-- Bottom Navigation (tetap sama) -->
    <div class="bottom-nav">
        <a href="index.html" class="nav-btn" id="navStore">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path d="M3 9L12 3L21 9V20H3V9Z" stroke-width="1.5" stroke-linejoin="round" />
                <path d="M9 20V14H15V20" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <span>STORE</span>
        </a>
        <a href="stats.html" class="nav-btn" id="navStats">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path d="M21 20H4V4" stroke-width="1.5" stroke-linecap="round" />
                <path d="M7 16V12" stroke-width="1.5" stroke-linecap="round" />
                <path d="M12 16V8" stroke-width="1.5" stroke-linecap="round" />
                <path d="M17 16V10" stroke-width="1.5" stroke-linecap="round" />
            </svg>
            <span>STATS</span>
        </a>
        <a href="profil.html" class="nav-btn active" id="navProfile">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <circle cx="12" cy="8" r="4" stroke-width="1.5" />
                <path d="M5 20V19C5 15.1 8.1 12 12 12C15.9 12 19 15.1 19 19V20" stroke-width="1.5" stroke-linecap="round" />
            </svg>
            <span>PROFIL</span>
        </a>
    </div>

    <main class="container">
        <!-- Marketplace Header (tetap sama) -->
        <div class="marketplace-header">
            <div class="brand-section">
                <div class="marketplace-logo">
                    <svg width="56" height="56" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M20 12V8H16V4H12V8H8V12H4V16H8V20H12V16H16V12H20Z" fill="url(#wineGrad)" stroke="white" stroke-width="1.2"/>
                        <defs>
                            <linearGradient id="wineGrad" x1="4" y1="4" x2="20" y2="20" gradientUnits="userSpaceOnUse">
                                <stop stop-color="#B86BFF"/>
                                <stop offset="0.5" stop-color="#FF6B8B"/>
                                <stop offset="1" stop-color="#6BCBFF"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
                <div class="brand-text">
                    <span class="brand-name">WINEDASH</span>
                    <span class="brand-sub">NFT GIFT • TON Market</span>
                </div>
            </div>
            
            <!-- User Profile Section -->
            <div class="user-profile" id="userProfile">
                <div class="user-avatar" id="userAvatar">
                    <span class="avatar-initial">?</span>
                </div>
                <div class="user-info">
                    <span class="user-balance" id="userBalance">Memuat saldo...</span>
                </div>
            </div>
        </div>

        <!-- Profile Header akan diisi oleh JavaScript -->
        <div class="profile-header glass-panel" id="profileHeader" style="display: none;"></div>

        <!-- Cards Grid Container -->
        <div class="cards-grid-container" id="cardsGridContainer">
            <div class="cards-grid" id="cardsGrid"></div>
        </div>

        <!-- Scroll to Top Button -->
        <div class="scroll-top" id="scrollTopBtn">
            <div class="scroll-top-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.5" fill="rgba(31,44,51,0.9)"/>
                    <path d="M12 16V8M12 8L8 12M12 8L16 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <span class="scroll-top-text">Top</span>
        </div>

        <!-- Bottom Sheet Panel -->
        <div class="bottom-sheet-overlay" id="bottomSheetOverlay">
            <div class="bottom-sheet glass-panel" id="bottomSheet">
                <div class="sheet-header">
                    <div class="sheet-handle"></div>
                    <button class="sheet-close-btn" id="sheetCloseBtn" title="Close">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18 6L6 18M6 6L18 18" stroke-linecap="round"/>
                        </svg>
                    </button>
                </div>
                <div class="sheet-content" id="sheetContent">
                    <!-- Dynamic content -->
                </div>
            </div>
        </div>

        <!-- Loading State -->
        <div class="loading-state" id="loadingState">
            <div class="loading-spinner"></div>
            <span>Loading profile...</span>
        </div>

        <!-- Toast Notification -->
        <div class="toast-notification" id="toastNotification">
            <span id="toastMessage">Link copied to clipboard!</span>
        </div>
    </main>

    <script src="js/profil.js"></script>
</body>
</html>
