<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>WINEDASH • NFT GIFT Market</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Lottie Web Player -->
    <script src="https://unpkg.com/@lottiefiles/lottie-player@1.7.1/dist/lottie-player.js"></script>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="noise"></div>
    <div class="gradient-bg"></div>
    
    <main class="container">
        <!-- Marketplace Header - Tanpa Glass Panel -->
        <div class="marketplace-header">
            <div class="brand-section">
                <div class="marketplace-logo">
                    <svg width="56" height="56" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M20 12V8H16V4H12V8H8V12H4V16H8V20H12V16H16V12H20Z" fill="url(#wineGrad)" stroke="white" stroke-width="1.2"/>
                        <defs>
                            <linearGradient id="wineGrad" x1="4" y1="4" x2="20" y2="20" gradientUnits="userSpaceOnUse">
                                <stop stop-color="#B86BFF"/>
                                <stop offset="0.5" stop-color="#FF6B8B"/>
                                <stop offset="1" stop-color="#6BCBFF"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
                <div class="brand-text">
                    <span class="brand-name">WINEDASH</span>
                    <span class="brand-sub">NFT GIFT • TON Market</span>
                </div>
            </div>
            
            <!-- User Profile Section - Paling Kanan -->
            <div class="user-profile" id="userProfile">
                <div class="user-info">
                    <span class="user-name" id="userName">Guest</span>
                    <span class="user-username" id="userUsername"></span>
                </div>
                <div class="user-avatar" id="userAvatar">
                    <span class="avatar-initial">?</span>
                </div>
            </div>
        </div>

        <!-- Filter Section - Dengan Items & Floor Price -->
        <div class="filter-section glass-panel">
            <!-- Top Bar: Filters Button, Stats, and Search -->
            <div class="filter-top-bar">
                <div class="filter-left">
                    <button class="filter-toggle" id="filterToggle">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M4 6H20M4 12H16M4 18H10" stroke-width="1.5" stroke-linecap="round"/>
                        </svg>
                        <span>Filters</span>
                        <svg class="toggle-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M6 9L12 15L18 9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                    
                    <div class="marketplace-stats">
                        <div class="stat-item">
                            <span class="stat-label">Items</span>
                            <span class="stat-value" id="total-items">0</span>
                        </div>
                        <div class="stat-divider"></div>
                        <div class="stat-item">
                            <span class="stat-label">Floor</span>
                            <span class="stat-value" id="floor-price">0</span>
                        </div>
                    </div>
                </div>
                
                <div class="search-wrapper">
                    <span class="search-label">Search ID</span>
                    <div class="search-input-container">
                        <input type="text" id="idSearchInput" class="id-search-input" placeholder="Type ID...">
                        <button class="id-search-clear" id="idSearchClear">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <path d="M18 6L6 18M6 6L18 18" stroke-width="1.5" stroke-linecap="round"/>
                            </svg>
                        </button>
                        <div class="search-icon">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <circle cx="11" cy="11" r="7" stroke-width="1.5"/>
                                <path d="M16 16L21 21" stroke-width="1.5" stroke-linecap="round"/>
                            </svg>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Filter Bubbles (Hidden by default, shown when Filters clicked) -->
            <div class="filter-bubbles" id="filterPanel">
                <!-- Gift Name Bubble -->
                <div class="filter-bubble" data-filter="gift">
                    <span class="bubble-label">Gift Name</span>
                    <span class="bubble-count" id="giftCount">0</span>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M19 9L12 16L5 9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                
                <!-- Model Bubble (disabled by default) -->
                <div class="filter-bubble disabled" data-filter="model" id="modelBubble">
                    <span class="bubble-label">Model</span>
                    <span class="bubble-count" id="modelCount">0</span>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M19 9L12 16L5 9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                
                <!-- Symbol Bubble (disabled by default) -->
                <div class="filter-bubble disabled" data-filter="symbol" id="symbolBubble">
                    <span class="bubble-label">Symbol</span>
                    <span class="bubble-count" id="symbolCount">0</span>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M19 9L12 16L5 9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                
                <!-- Backdrop Bubble (disabled by default) -->
                <div class="filter-bubble disabled" data-filter="bg" id="bgBubble">
                    <span class="bubble-label">Backdrop</span>
                    <span class="bubble-count" id="bgCount">0</span>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M19 9L12 16L5 9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                
                <!-- Sort Bubble -->
                <div class="filter-bubble" data-filter="sort">
                    <span class="bubble-label">Sort By</span>
                    <span class="bubble-value" id="sortValue">Low to High</span>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M19 9L12 16L5 9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
            </div>

            <!-- Active Filters Container (Hidden by default, shown when Filters clicked) -->
            <div class="active-filters-container" id="activeFiltersContainer">
                <div class="active-filters-bar">
                    <div class="active-filters-left">
                        <span class="active-filters-title">Active:</span>
                        <div class="active-filters-scroll" id="activeFiltersScroll">
                            <div class="active-filters" id="activeFilters"></div>
                        </div>
                    </div>
                    <div class="active-filters-actions">
                        <button class="filter-action-btn eye-btn" id="viewActiveFiltersBtn" title="View all active filters">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <circle cx="12" cy="12" r="2" stroke-width="1.5"/>
                                <path d="M22 12C22 12 19 18 12 18C5 18 2 12 2 12C2 12 5 6 12 6C19 6 22 12 22 12Z" stroke-width="1.5"/>
                            </svg>
                        </button>
                        <button class="filter-action-btn share-btn" id="shareFilterBtn" title="Share current filters">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                                <polyline points="16 6 12 2 8 6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                                <line x1="12" y1="2" x2="12" y2="15" stroke-width="1.5" stroke-linecap="round"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Clear & Apply Buttons -->
                <div class="filter-bottom-actions" id="filterBottomActions">
                    <button class="filter-clear-btn" id="clearAllFilters">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M18 6L6 18M6 6L18 18" stroke-width="1.5" stroke-linecap="round"/>
                        </svg>
                        Clear
                    </button>
                    <button class="filter-apply-btn" id="applyFiltersBtn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M5 12H19M19 12L15 8M19 12L15 16" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        Apply
                    </button>
                </div>
            </div>
        </div>

        <!-- Filter Popup Panel (Slide out from left) -->
        <div class="filter-popup-overlay" id="filterPopupOverlay">
            <div class="filter-popup glass-panel" id="filterPopup">
                <div class="filter-popup-header">
                    <span class="filter-popup-title" id="filterPopupTitle">Select Gift Name</span>
                    <button class="filter-popup-close" id="filterPopupClose">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M18 6L6 18M6 6L18 18" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                    </button>
                </div>
                
                <div class="filter-popup-search" id="filterPopupSearch">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <circle cx="11" cy="11" r="7" stroke-width="1.5"/>
                        <path d="M16 16L21 21" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                    <input type="text" id="popupSearchInput" class="popup-search-input" placeholder="Search...">
                </div>
                
                <div class="filter-popup-list" id="filterPopupList">
                    <!-- Dynamic content will be injected here -->
                </div>
            </div>
        </div>

        <!-- Active Filters Popup (Eye Button) -->
        <div class="active-filters-popup-overlay" id="activeFiltersPopupOverlay">
            <div class="active-filters-popup glass-panel" id="activeFiltersPopup">
                <div class="popup-header">
                    <span class="popup-title">Active Filters</span>
                    <button class="popup-close" id="activeFiltersPopupClose">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M18 6L6 18M6 6L18 18" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                    </button>
                </div>
                <div class="popup-content" id="activeFiltersPopupContent">
                    <!-- Dynamic content will be injected here -->
                </div>
            </div>
        </div>

        <!-- Cards Grid Container -->
        <div class="cards-grid-container" id="cardsGridContainer">
            <div class="cards-grid" id="cardsGrid"></div>
        </div>

        <!-- Scroll to Top Button -->
        <div class="scroll-top" id="scrollTopBtn">
            <div class="scroll-top-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.5" fill="rgba(31,44,51,0.9)"/>
                    <path d="M12 16V8M12 8L8 12M12 8L16 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <span class="scroll-top-text">Top</span>
        </div>

        <!-- Bottom Sheet Panel -->
        <div class="bottom-sheet-overlay" id="bottomSheetOverlay">
            <div class="bottom-sheet glass-panel" id="bottomSheet">
                <div class="sheet-handle"></div>
                <div class="sheet-content" id="sheetContent">
                    <!-- Dynamic content will be injected here -->
                </div>
            </div>
        </div>

        <!-- Loading State -->
        <div class="loading-state" id="loadingState">
            <div class="loading-spinner"></div>
            <span>Loading gifts...</span>
        </div>

        <!-- Toast Notification -->
        <div class="toast-notification" id="toastNotification">
            <span id="toastMessage">Link copied to clipboard!</span>
        </div>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
