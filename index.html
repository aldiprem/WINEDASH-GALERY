<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>NFT Gift Telegram</title>
  <meta name="viewport" content="width=device-width, initial-scale=0.5, maximum-scale=0.5, user-scalable=no">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <div id="pageLoader">
    <div class="loader-box">
      <div class="loader-logo">
        <span>W</span><span>G</span>
      </div>
      <div class="loader-text">WINEDASH GIFT</div>
      <div class="loader-bar">
        <span></span>
      </div>
    </div>
  </div>

  <div id="giftDetailPanel" class="gift-detail-panel">
    <div class="panel-content">
      <div class="image-wrap">
        <img id="detailImg" src="" alt="">
      </div>
      <h3 id="detailName"></h3>
      <div class="detail-chips">
        <span id="detailModel" class="chip"></span>
        <span id="detailSymbol" class="chip"></span>
        <span id="detailBg" class="chip"></span>
      </div>
      <p id="detailPrice"></p>
      <div class="panel-buttons">
        <a id="btnBeli" href="#" target="_blank">BELI</a>
        <a id="btnNego" href="#" target="_blank">NEGO</a>
      </div>
      <span id="closePanel" class="close-panel">×</span>
    </div>
  </div>

  <div class="topbar">
    <h1>🎁 WINEDASH GIFT</h1>
    <div class="gift-search-container">
      <div id="giftSelected" class="gift-bubbles"></div>
      <input type="text" id="giftSearchInput" placeholder="Search gift...">
      <div id="giftDropdown" class="gift-dropdown"></div>
    </div>
  </div>

  <!-- FILTER -->
  <div class="giftfilters">
    <select id="giftFilter"><option value="">Gift</option></select>
    <select id="modelFilter"><option value="">Model</option><option value="ice">Ice</option><option value="clover">Clover</option></select>
    <select id="symbolFilter"><option value="">Symbol</option><option value="paw">Paw</option><option value="luck">Luck</option></select>
    <select id="bgFilter"><option value="">Background</option><option value="blue">Blue</option><option value="gold">Gold</option></select>
    <input type="number" id="maxPrice" placeholder="Max TON">
  </div>

  <div id="panelOverlay" class="panel-overlay"></div>

  <!-- NFT GRID -->
  <div class="grid" id="giftGrid"></div>

  <script src="js/app.js"></script>
</body>

</html>
